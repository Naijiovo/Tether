<style>
:root {
  --stage: #12141a;
  --shell-bg: #f5f6f8;
  --ink: #1c1c1e;
  --ink-soft: #4b4f58;
  --muted: #8a8f98;
  --hair: #e7e9ee;
  --card: #ffffff;
  --accent: #3d5cff;
  --accent-soft: #e8ecff;
  --danger: #ff4d5e;
  --gold: #ff9500;
  --font-display: 'Manrope', 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif;
  --font-body: var(--user-font, 'Noto Sans SC', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width:100%; height:100%; min-height:100%; overflow:hidden; margin:0; padding:0; background:var(--shell-bg); }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  color: var(--ink);
}

button { font-family: inherit; }
img { -webkit-user-drag: none; }
i { display: inline-flex; align-items: center; justify-content: center; }

/* 全屏容器 */
.phone { width:100vw; height:100dvh; min-height:100%;
  width: 100vw;
  height: 100dvh;
  background: var(--shell-bg);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 灵动岛 */
.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 28px;
  background: #000000;
  border-radius: 0 0 14px 14px;
  z-index: 50;
  transition: top 0.3s;
}

/* 顶部导航栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 8px;
  background: var(--shell-bg);
  position: sticky;
  top: 0;
  z-index: 20;
  flex: none;
}
.topbar .tb-left { display: flex; align-items: center; gap: 9px; min-width: 0; cursor: pointer; }
.topbar .tb-left img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); flex: none; }
.topbar .tb-text { min-width: 0; }
.topbar h1 { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.topbar .tb-status { font-size: 12px; }
.topbar .tb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); cursor: pointer; box-shadow: 0 1px 3px rgba(20,20,30,.08); font-size: 16px; }
.topbar .icon-btn:active { transform: scale(.94); }

/* 视图切换 */
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 90px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.flexcol { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
.view.hidden { display: none !important; }

/* 底部 Tab */
.tabbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: flex;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--hair);
  padding: 8px 4px calc(10px + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; cursor: pointer; padding: 4px 0; }
.tabbar button i { font-size: 20px; }
.tabbar button.active { color: var(--accent); }

/* 聊天区域 */

/* 默认气泡样式（可被自定义CSS覆盖） */

.chat-row .cr-sticker { width: 84px; border-radius: 10px; cursor: pointer; display: block; }
.chat-row .cr-meta { font-size: 11px; color: var(--muted); margin: 4px 4px 0; display: flex; gap: 6px; }

.chat-empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; padding: 40px; }

/* 红包/转账 */

/* 文件 */
.chat-bubble.file { display: flex; align-items: center; gap: 10px; min-width: 160px; cursor: pointer; }
.chat-bubble.file .file-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; flex: none; font-size: 18px; }

/* 输入区 */

/* + 面板 */

/* 信件 */

.feed { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }

/* 设置 */

.setting-row .mini { border: 1px solid var(--hair); background: var(--card); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.setting-row .mini.danger { color: var(--danger); border-color: #ffd7db; }

.switch { position: relative; width: 46px; height: 26px; flex: none; }

.color-dots { display: flex; gap: 10px; }

.avatar-pickers { display: flex; gap: 20px; padding: 14px 16px; border-top: 1px solid var(--hair); }

.card-list { max-height: 200px; overflow-y: auto; margin: 0 16px 14px; border: 1px solid var(--hair); border-radius: 12px; }
.card-list .ci { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 13.5px; border-top: 1px solid var(--hair); gap: 10px; }

.sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0 16px 14px; }

.sticker-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--accent-soft); }
.sticker-grid button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.8); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }

.onboard-mask .ob-icon { width: 60px; height: 60px; border-radius: 18px; background: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; flex: none; font-size: 28px; }

/* 图片查看器 */
.img-viewer { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 350; display: none; align-items: center; justify-content: center; }

/* Toast */

.toast-item { background: rgba(28,28,30,0.95); color: #fff; padding: 12px 20px; border-radius: 16px; font-size: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); animation: toastIn .25s ease; }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  if (sameDay) return `${hh}:${mm}`;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`;
}
function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
// 图片压缩逻辑
function compressImage(file, maxWidth = 800) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((maxWidth / w) * h); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(file.type || 'image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function generateReplyText(){
  if (state.cards.length===0) return '（字卡库是空的，去设置里添加一些吧）';
  let text;
  if (!state.settings.concatEnabled){
    text = state.cards[randInt(0, state.cards.length-1)];
  } else {
    const n = Math.min(Math.max(1, state.settings.maxConcat||1), state.cards.length);
    const count = randInt(1, n);
    const pool = [...state.cards];
    const picked = [];
    for (let i=0; i<count; i++){
      const idx = randInt(0, pool.length-1);
      picked.push(pool[idx]);
      pool.splice(idx,1);
    }
    text = picked.join('，');
  }
  return maybeDecorateWithEmoji(text);
}
function maybeDecorateWithEmoji(text){
  const decorPool = [...state.kaomoji, ...EMOJI_CATEGORIES.flatMap(c=>c.list)];
  if (decorPool.length && Math.random() < 0.25){
    text += decorPool[randInt(0,decorPool.length-1)];
  }
  return text;
}
function pickCardsWithReplacement(n){
  if (state.cards.length===0) return '（字卡库是空的，去设置里添加一些吧）';
  const arr = [];
  for (let i=0;i<n;i++) arr.push(state.cards[randInt(0, state.cards.length-1)]);
  return maybeDecorateWithEmoji(arr.join('，'));
}
function maybeSticker(){
  if (state.stickers.length===0) return '';
  if (Math.random()*100 < state.settings.stickerChance) return state.stickers[randInt(0, state.stickers.length-1)];
  return '';
}
function pickSpecialOrRandomAmount(maxBalance){
  const affordableSpecial = SPECIAL_MONEY_AMOUNTS.filter(a=>a<=maxBalance);
  if (affordableSpecial.length && Math.random()<0.5) return affordableSpecial[randInt(0,affordableSpecial.length-1)];
  const cap = Math.max(1, Math.min(maxBalance, 200));
  return randInt(1, cap);
}

function renderChat(){
  document.getElementById('topbarAvatar').src = avatarOf('partner');
  document.getElementById('topbarTitle').textContent = nameOf('partner');
  renderStatusTag();
  setTopbarSub();
  const box = document.getElementById('chatMessages');
  if (state.messages.length===0){
    box.innerHTML = `<div class="chat-empty"><i class="fa-solid fa-comment-dots"></i><div>还没有消息，说点什么吧</div></div>`;
    return;
  }
  
  // 使用 DocumentFragment 优化渲染
  const frag = document.createDocumentFragment();
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = state.messages.map(msgHTML).join('');
  while(tempDiv.firstChild) frag.appendChild(tempDiv.firstChild);
  
  box.innerHTML = '';
  box.appendChild(frag);
  scrollChatToBottom();
}
function scrollChatToBottom(){
  const box = document.getElementById('chatMessages');
  if (!box) return;

  const force = ()=>{
    box.scrollTop = Math.max(0, box.scrollHeight - box.clientHeight);
  };

  force();
  requestAnimationFrame(()=>{
    force();
    requestAnimationFrame(()=>{
      force();
      setTimeout(force, 40);
      setTimeout(force, 160);
    });
  });

  // 图片/视频尺寸异步确定后，避免媒体消息把底部顶开。
  box.querySelectorAll('img,video').forEach(el=>{
    if (!el.complete || (el.tagName==='VIDEO' && !el.readyState)){
      el.addEventListener('load', force, {once:true});
      el.addEventListener('loadedmetadata', force, {once:true});
    }
  });
}
function msgHTML(m){
  if (m.sysline) return `<div class="chat-sysline">${escapeHTML(m.sysline)}</div>`;
  if (m.recalled) return `<div class="chat-sysline">${m.from==='me'?'你':escapeHTML(nameOf('partner'))}撤回了一条消息</div>`;
  const rowClass = m.from==='me' ? 'me' : 'partner';
  let inner = '';
  const quoteHtml = m.quote ? `<div class="cr-quote">${escapeHTML(nameOf(m.quote.from))}：${escapeHTML(m.quote.text.length>28?m.quote.text.slice(0,28)+'…':m.quote.text)}</div>` : '';
  if (m.money){
    const mm = m.money;
    const isEnvelope = mm.type==='envelope';
    let stateLabel = '';
    if(mm.returned) {
      stateLabel = '已退回';
    } else if(mm.opened) {
      stateLabel = isEnvelope ? '已领取' : '已收款';
    } else {
      stateLabel = isEnvelope ? (mm.from==='me'?'等待对方领取':'点击领取') : (mm.from==='me'?'等待对方确认':'点击确认收款');
    }
    const openedClass = (mm.opened || mm.returned) ? 'opened' : '';
    inner = `<div class="chat-bubble money ${isEnvelope?'envelope':'transfer'} ${openedClass}" data-mid="${m.id}">
      <div class="money-head"><i class="fa-solid ${isEnvelope?'fa-gift':'fa-money-bill-wave'}"></i>${isEnvelope?'红包':'转账'}</div>
      ${mm.note ? `<div class="money-note">${escapeHTML(mm.note)}</div>` : ''}
      <div class="money-amt">¥${mm.amount}</div>
      <div class="money-state">${stateLabel}</div>
    </div>`;
  } else if (m.file){
    inner = `<div class="chat-bubble file ${m.from==='me'?'sent':'recv'}" data-mid="${m.id}">
      <div class="file-icon"><i class="fa-solid fa-file"></i></div>
      <div class="file-name">${escapeHTML(m.file.name)}</div>
    </div>`;
  } else {
    const parts = [];
    if (m.image) parts.push(`<img class="cr-img" src="${m.image}" data-imgzoom="${m.image}">`);
    if (m.video) parts.push(`<video class="cr-video" controls src="${m.video}"></video>`);
    if (m.sticker) parts.push(`<img class="cr-sticker" src="${m.sticker}" data-imgzoom="${m.sticker}">`);
    if (m.text) parts.push(`<div class="chat-bubble ${m.from==='me'?'sent':'recv'}">${quoteHtml}${escapeHTML(m.text)}</div>`);
    inner = parts.join('');
  }
  const meta = [];
  if (!m.readOnly) meta.push(fmtTime(m.time));
  if (m.from==='me' && !m.money && !m.file) meta.push(m.readStatus==='read' ? '已读' : '未读');
  
  let readOnlyHtml = m.readOnly ? `<div class="cr-readonly"><i class="fa-solid fa-eye"></i> 对方已读</div>` : '';

  return `<div class="chat-row ${rowClass}" data-id="${m.id}">
    <img class="cr-ava" src="${avatarOf(m.from)}" data-from="${m.from}">
    <div class="cr-col">${inner}${readOnlyHtml}<div class="cr-meta">${meta.join(' · ')}</div></div>
  </div>`;
}

(function setupChatDelegatedEvents(){
  const box = document.getElementById('chatMessages');
  box.addEventListener('click', async e=>{
    const img = e.target.closest('[data-imgzoom]');
    if (img){ openImgViewer(img.dataset.imgzoom); return; }
    const moneyBubble = e.target.closest('.chat-bubble.money');
    if (moneyBubble){
      const id = moneyBubble.dataset.mid;
      const msg = state.messages.find(mm=>mm.id===id);
      if (!msg || !msg.money || msg.money.opened || msg.money.returned) return;
      if (msg.money.from==='me') return;
      msg.money.opened = true;
      state.me.balance += msg.money.amount;
      await saveAll(); renderChat(); renderSettings();
      toast(`收到 ¥${msg.money.amount}`, 'fa-money-bill-wave');
      return;
    }
    const fileBubble = e.target.closest('.chat-bubble.file');
    if (fileBubble){
      const id = fileBubble.dataset.mid;
      const msg = state.messages.find(mm=>mm.id===id);
      if (!msg || !msg.file) return;
      const a = document.createElement('a');
      a.href = msg.file.data; a.download = msg.file.name; a.click();
      return;
    }
  });
  box.addEventListener('dblclick', e=>{
    const ava = e.target.closest('.cr-ava[data-from="partner"]');
    if (ava) sendPoke();
  });
})();

/* 长按消息：引用 / 撤回；左滑消息：丝滑引用 */
(function setupLongPressMessage(){
  const box = document.getElementById('chatMessages');
  if (!box) return;

  let pressTimer = null, pressedRow = null;
  let startX = 0, startY = 0, tracking = false, swiping = false, quoteReady = false;

  const resetRow = (row)=>{
    if (!row) return;
    row.classList.remove('swiping');
    row.style.transform = '';
  };

  const clearPress = (keepRow=false)=>{
    if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    if (pressedRow && swiping) resetRow(pressedRow);
    if (!keepRow) pressedRow = null;
    tracking = false;
    swiping = false;
    quoteReady = false;
  };

  box.addEventListener('pointerdown', e=>{
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const row = e.target.closest('.chat-row');
    if (!row || !row.dataset.id) return;

    clearPress();
    pressedRow = row;
    startX = e.clientX;
    startY = e.clientY;
    tracking = true;

    // 抢到指针后，避免浏览器在消息区域把手势当成页面横向导航。
    try { row.setPointerCapture?.(e.pointerId); } catch (_) {}

    pressTimer = setTimeout(()=>{
      if (!tracking || swiping || !pressedRow) return;
      if (navigator.vibrate) navigator.vibrate(15);
      openMessageActionSheet(pressedRow.dataset.id);
      pressTimer = null;
    }, 480);
  }, {passive:true});

  box.addEventListener('pointermove', e=>{
    if (!tracking || !pressedRow || e.isPrimary === false) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!swiping){
      // 竖向滑动：立刻交还给原生滚动。
      if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx) * 1.05){
        clearPress();
        return;
      }

      // 只有向左才进入引用手势；阈值稍低，手机上更容易触发。
      if (dx < -8 && Math.abs(dx) > Math.abs(dy) * 1.05){
        swiping = true;
        if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
        pressedRow.classList.add('swiping');
        try { pressedRow.setPointerCapture?.(e.pointerId); } catch (_) {}
      } else {
        return;
      }
    }

    // 一旦确定是左滑，就阻止页面接管横向手势；竖向滚动仍保持原生体验。
    if (e.cancelable) e.preventDefault();

    const raw = Math.max(-88, Math.min(0, dx));
    const distance = Math.abs(raw);
    const eased = distance <= 52 ? raw : -52 - (distance - 52) * 0.28;
    pressedRow.style.transform = `translate3d(${eased}px,0,0)`;
    quoteReady = distance >= 42;
  }, {passive:false});

  const finishGesture = (e)=>{
    if (!pressedRow || e?.isPrimary === false) return;
    const row = pressedRow;
    const id = row.dataset.id;
    const shouldQuote = swiping && quoteReady;

    try { row.releasePointerCapture?.(e.pointerId); } catch (_) {}
    resetRow(row);
    clearPress();

    if (shouldQuote){
      const msg = state.messages.find(m=>m.id===id);
      if (msg && !msg.sysline && !msg.recalled) setQuote(msg);
    }
  };

  box.addEventListener('pointerup', finishGesture, {passive:true});
  box.addEventListener('pointercancel', e=>{
    if (pressedRow) {
      try { pressedRow.releasePointerCapture?.(e.pointerId); } catch (_) {}
    }
    clearPress();
  }, {passive:true});

  // pointerleave 不再直接取消：有 pointer capture 时，手指移出消息行仍可正常完成引用。
  box.addEventListener('pointerout', e=>{
    if (!pressedRow || !swiping) return;
    if (e.relatedTarget && pressedRow.contains(e.relatedTarget)) return;
  }, {passive:true});
})();
function openMessageActionSheet(msgId){
  const msg = state.messages.find(m=>m.id===msgId);

  const canRecall = msg.from==='me';
  openSheet(`

    <div class="sheet-btn-row" style="flex-direction:column;gap:8px;">
      <button id="quoteMsgBtn" style="width:100%;justify-content:center;"><i class="fa-solid fa-quote-left"></i> 引用</button>
      ${canRecall ? `<button id="recallMsgBtn" style="width:100%;justify-content:center;color:var(--danger);"><i class="fa-solid fa-rotate-left"></i> 撤回</button>` : ''}
      <button onclick="closeSheet()" style="width:100%;justify-content:center;">取消</button>
    </div>
  `, ()=>{
    document.getElementById('quoteMsgBtn').addEventListener('click', ()=>{

      await saveAll(); renderChat();
    });
  });
}

function openBatchSendSheet() {
  openSheet(`
    <h2>批量发送</h2>
    <p style="font-size:12px; color:var(--muted); margin-top:-8px; margin-bottom:12px;">每行作为一条独立消息，将依次发出。</p>

    <div class="sheet-btn-row">
      <button onclick="closeSheet()">取消</button>
      <button class="primary" id="batchSendBtn">发送</button>
    </div>
  `, ()=>{
    document.getElementById('batchSendBtn').addEventListener('click', async ()=>{
      const val = document.getElementById('batchInput').value;
      const lines = val.split('\n').map(l=>l.trim()).filter(Boolean);
      if(lines.length === 0) return;
      closeSheet();
      
      for(let i=0; i<lines.length; i++) {
        const msg = { id:'m'+Date.now()+randInt(0,999), from:'me', text:lines[i], time:Date.now(), readStatus:'unread' };
        state.messages.push(msg);
        await saveAll(); renderChat();
        if(i < lines.length - 1) {
          await sleep(rand(500, 1000));
        }
      }
      triggerChatReply();
      maybeIncomingCall();
    });
  });
}

function markMyMessagesRead(){
  let changed = false;
  state.messages.forEach(m=>{ if (m.from==='me' && m.readStatus==='unread'){ m.readStatus='read'; changed=true; } });
  return changed;
}
function triggerChatReply(){
  const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
  const willReply = Math.random()*100 < chance;
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;

  if (!willReply){
    setTimeout(async ()=>{
      markMyMessagesRead();
      // 不单独发消息，仅标记已读
      await saveAll(); renderChat();
    }, Math.min(delayMs, 2500));
    return;
  }
  partnerTyping = true; setTopbarSub();
  setTimeout(async ()=>{
    markMyMessagesRead();
    partnerTyping = false;
    // 小概率改为发红包/转账，而不是普通文字
    const roll = Math.random()*100;
    let finalMsg;
    if (roll < state.settings.redEnvelopeChance && state.partner.balance > 0){
      const amt = pickSpecialOrRandomAmount(state.partner.balance);
      state.partner.balance -= amt;
      finalMsg = { id:'m'+Date.now(), from:'partner', money:{type:'envelope', amount:amt, note:generateReplyText(), opened:false, from:'partner'}, time:Date.now() };
    } else if (roll < state.settings.redEnvelopeChance + state.settings.transferChance && state.partner.balance > 0){
      const amt = pickSpecialOrRandomAmount(state.partner.balance);
      state.partner.balance -= amt;
      finalMsg = { id:'m'+Date.now(), from:'partner', money:{type:'transfer', amount:amt, opened:false, from:'partner'}, time:Date.now() };
    } else {
      finalMsg = { id:'m'+Date.now(), from:'partner', text:generateReplyText(), sticker:maybeSticker(), time:Date.now() };
    }
    state.messages.push(finalMsg);
    await saveAll(); renderChat();
    notify(nameOf('partner')+'：'+ (finalMsg.text || (finalMsg.money?'[发来了红包/转账]':'[表情包]')));

    // 对方可能连续发送多条消息（与字卡拼接是两回事）
    const isMoneyMsg = !!finalMsg.money;
    if (!isMoneyMsg && state.settings.multiMsgEnabled){
      const lo = Math.max(1, Math.min(state.settings.multiMsgMin, state.settings.multiMsgMax));
      const hi = Math.max(state.settings.multiMsgMin, state.settings.multiMsgMax);
      const extra = randInt(lo, hi) - 1;
      for (let i=0;i<extra;i++){
        await new Promise(r=> setTimeout(r, randInt(600,1500)));
        const msg2 = { id:'m'+Date.now()+i+1, from:'partner', text:generateReplyText(), sticker:maybeSticker(), time:Date.now() };
        state.messages.push(msg2);
        await saveAll(); renderChat();
      }
    }
  }, delayMs);
}
async function letPartnerSpeakInChat(){
  closePlusPanel();
  partnerTyping = true; setTopbarSub();
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;

}

  openSheet(`

    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">我的余额：¥${state.me.balance}</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="number" id="moneyAmt" class="sheet-input" placeholder="金额" style="flex:1;">
      <button class="mini" id="moneyRandomBtn"><i class="fa-solid fa-dice"></i> 随机</button>
    </div>
    ${isEnvelope ? `<input type="text" id="moneyNote" class="sheet-input" placeholder="写句祝福语（可选）">` : ''}
    <div class="sheet-btn-row">
      <button onclick="closeSheet()">取消</button>
      <button class="primary" id="moneySendBtn">发送</button>
    </div>
  `, ()=>{
    document.getElementById('moneyRandomBtn').addEventListener('click', ()=>{
      const maxCap = state.me.balance > 0 ? state.me.balance : 520;
      document.getElementById('moneyAmt').value = pickSpecialOrRandomAmount(maxCap);
    });
    document.getElementById('moneySendBtn').addEventListener('click', async ()=>{
      const amt = parseInt(document.getElementById('moneyAmt').value,10);
      if (!amt || amt<=0) return;
      const note = isEnvelope ? document.getElementById('moneyNote').value.trim() : '';
      state.me.balance -= amt;
      const msg = { id:'m'+Date.now(), from:'me', money:{type, amount:amt, note, opened:false, from:'me'}, time:Date.now() };
      state.messages.push(msg);
      closeSheet();
      await saveAll(); renderChat(); renderSettings();
      triggerMoneyReplyReaction(msg.id);
      triggerChatReply();
    });
  });
}
function triggerMoneyReplyReaction(msgId){
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;
  setTimeout(async ()=>{
    const msg = state.messages.find(m=>m.id===msgId);
    if (msg && msg.money && !msg.money.opened && !msg.money.returned){
      const chance = msg.money.type === 'envelope' ? state.settings.redEnvelopeAcceptChance : state.settings.transferAcceptChance;
      const willAccept = Math.random() * 100 < chance;
      if(willAccept) {
        msg.money.opened = true;
        state.partner.balance += msg.money.amount;
      } else {
        msg.money.returned = true;
        state.me.balance += msg.money.amount;
      }
    }
    await saveAll(); renderChat(); renderSettings();
  }, delayMs);
}

let callState = 'idle';
let callSeconds = 0;
let callIsVideo = false;
let callBg = '';

function startIncomingCall(isVideo){
  if (callState !== 'idle') return;
  callState = 'ringing'; callIsVideo = isVideo;
  document.getElementById('callAvatar').src = avatarOf('partner');
  document.getElementById('callName').textContent = nameOf('partner');
  document.getElementById('callStatus').textContent = isVideo ? '视频来电…' : '来电…';
  document.getElementById('callTimer').style.display='none';
  document.getElementById('callActions').innerHTML = `
    <button class="call-btn decline" id="callDeclineBtn"><div class="icon-circle"><i class="fa-solid fa-phone-slash"></i></div>挂断</button>
    <button class="call-btn accept" id="callAcceptBtn"><div class="icon-circle"><i class="fa-solid fa-phone"></i></div>接听</button>`;
  showCallScreen();
  document.getElementById('callAcceptBtn').onclick = ()=> acceptCall();
  document.getElementById('callDeclineBtn').onclick = ()=> endCall('已挂断');
  updateCallPill();
}
function startOutgoingCall(isVideo){
  if (callState !== 'idle') return;
  callState = 'outgoing'; callIsVideo = !!isVideo;
  document.getElementById('callAvatar').src = avatarOf('partner');
  document.getElementById('callName').textContent = nameOf('partner');
  document.getElementById('callStatus').textContent = callIsVideo ? '正在视频拨打…' : '正在拨打…';
  document.getElementById('callTimer').style.display='none';
  document.getElementById('callActions').innerHTML = `
    <div style="flex:1"></div>
    <button class="call-btn end" id="callEndBtn"><div class="icon-circle"><i class="fa-solid fa-phone-slash"></i></div>挂断</button>
    <div style="flex:1"></div>`;
  showCallScreen();
  document.getElementById('callEndBtn').onclick = ()=> endCall('已挂断');
  updateCallPill();
  setTimeout(()=>{
    if (callState !== 'outgoing') return;
    const willAccept = Math.random()*100 < state.settings.callAcceptChance;
    if (willAccept) acceptCall(); else endCall('对方未接听');
  }, randInt(2,4)*1000);
}
function acceptCall(){
  callState = 'active';
  document.getElementById('callStatus').textContent = callIsVideo ? '视频通话中' : '通话中';
  document.getElementById('callTimer').style.display='block';
  document.getElementById('callActions').innerHTML = `
    <div style="flex:1"></div>
    <button class="call-btn end" id="callEndBtn"><div class="icon-circle"><i class="fa-solid fa-phone-slash"></i></div>挂断</button>
    <div style="flex:1"></div>`;
  document.getElementById('callEndBtn').onclick = ()=> endCall('通话结束');
  document.getElementById('callScreen').classList.toggle('video-bg', callIsVideo);
  if (callIsVideo) document.getElementById('callScreen').style.backgroundImage = callBg ? `url("${callBg}")` : '';
  callSeconds = 0;
  callTimerInterval = setInterval(()=>{
    callSeconds++;
    const mm = String(Math.floor(callSeconds/60)).padStart(2,'0'), ss = String(callSeconds%60).padStart(2,'0');
    document.getElementById('callTimer').textContent = `${mm}:${ss}`;
    updateCallPill();
  },1000);
  updateCallPill();
}
function endCall(statusMsg){
  const wasActive = callState === 'active';
  callState = 'idle';
  if (callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval=null; }
  if (wasActive && callSeconds > 0){
    const mm = String(Math.floor(callSeconds/60)).padStart(2,'0'), ss = String(callSeconds%60).padStart(2,'0');
    statusMsg = `${statusMsg} ${mm}:${ss}`;
  }
  document.getElementById('callStatus').textContent = statusMsg;
  setTimeout(()=>{ document.getElementById('callScreen').classList.remove('show','video-bg'); document.getElementById('callScreen').style.backgroundImage=''; hideCallPill(); }, 700);
}
function showCallScreen(){ document.getElementById('callScreen').classList.add('show'); }
document.getElementById('callMinBtn').addEventListener('click', ()=>{ document.getElementById('callScreen').classList.remove('show'); updateCallPill(); });
document.getElementById('callBgBtn').addEventListener('click', ()=>{
  pickImage(url=>{ callBg = url; document.getElementById('callScreen').style.backgroundImage = `url("${callBg}")`; });
});
function updateCallPill(){
  const pill = document.getElementById('callPill');
  if (callState==='idle'){ hideCallPill(); return; }
  pill.classList.add('show');
  document.getElementById('callPillAvatar').src = avatarOf('partner');
  const textEl = document.getElementById('callPillText');
  if (callState==='ringing') textEl.textContent = nameOf('partner')+' 来电…';
  else if (callState==='outgoing') textEl.textContent = '拨打中…';
  else if (callState==='active'){
    const mm = String(Math.floor(callSeconds/60)).padStart(2,'0'), ss = String(callSeconds%60).padStart(2,'0');
    textEl.textContent = mm+':'+ss;
  }
}
function hideCallPill(){ document.getElementById('callPill').classList.remove('show'); }
document.getElementById('callPillEnd').addEventListener('click', ()=> endCall(callState==='ringing' ? '已挂断' : '通话结束'));
/* 悬浮条拖动 */
(function setupPillDrag(){
  const pill = document.getElementById('callPill');
  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0;
  pill.addEventListener('pointerdown', e=>{
    if (e.target.closest('.cp-btn')) return;
    dragging = true;
    const rect = pill.getBoundingClientRect();
    const phoneRect = document.getElementById('phone').getBoundingClientRect();
    origLeft = rect.left - phoneRect.left; origTop = rect.top - phoneRect.top;
    startX = e.clientX; startY = e.clientY;
    pill.style.left = origLeft+'px'; pill.style.top = origTop+'px'; pill.style.transform='none'; pill.style.right='auto';
    pill.setPointerCapture(e.pointerId);
  });
  pill.addEventListener('pointermove', e=>{
    if (!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    const phoneRect = document.getElementById('phone').getBoundingClientRect();
    let nl = origLeft+dx, nt = origTop+dy;
    nl = Math.max(6, Math.min(phoneRect.width-100, nl));
    nt = Math.max(6, Math.min(phoneRect.height-60, nt));
    pill.style.left = nl+'px'; pill.style.top = nt+'px';
  });
  const endDrag = e=>{ dragging=false; };
  pill.addEventListener('pointerup', endDrag);
  pill.addEventListener('pointercancel', endDrag);
  pill.addEventListener('click', e=>{
    if (e.target.closest('.cp-btn')) return;
    if (Math.abs((e.clientX||0)-startX) < 4) showCallScreen();
  });
})();

async function sendLetter(){
  const val = document.getElementById('letterInput').value.trim();
  if (!val) return;
  const waitingPhrase = LETTER_WAIT_PHRASES[randInt(0,LETTER_WAIT_PHRASES.length-1)];
  const letter = { id:'l'+Date.now(), from:'me', text:val, time:Date.now(), status:'sent', waitingPhrase };
  state.letters.push(letter);
  closeSheet();
  await saveAll();
  renderLetters();
  showPopup('信件已发出', waitingPhrase, 'fa-envelope');
  scheduleLetterReply(letter.id);
}
function scheduleLetterReply(id){
  const s = state.settings;
  const lo = Math.min(s.letterReplyMinMinutes, s.letterReplyMaxMinutes);
  const hi = Math.max(s.letterReplyMinMinutes, s.letterReplyMaxMinutes);
  const delayMin = randInt(lo, hi);
  setTimeout(async ()=>{
    const letter = state.letters.find(l=>l.id===id);
    if (!letter) return;
    letter.status = 'replied';
    letter.replyText = pickCardsWithReplacement(s.letterCardCount);
    letter.replyTime = Date.now();
    await saveAll(); renderLetters();
    const preview = letter.replyText.length>40 ? letter.replyText.slice(0,40)+'…' : letter.replyText;
    showPopup(nameOf('partner')+'回信了', preview, 'fa-envelope');
  }, delayMin*60*1000);
}

  const contextLine = showReplyContext ? `<div class="reply-context">回复了 ${escapeHTML(author.name)} 的动态</div>` : '';

}
function bindPostInteractions(root){
  root.querySelectorAll('.like-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const post = state.posts.find(p=>p.id===el.dataset.postid);
      if (!post) return;
      post.likedBy = post.likedBy || [];
      const idx = post.likedBy.indexOf('me');
      if (idx>-1) post.likedBy.splice(idx,1); else post.likedBy.push('me');
      await saveAll(); renderProfileTab();
    });
  });
  root.querySelectorAll('.reply-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const row = root.querySelector(`.reply-input-row[data-postid="${el.dataset.postid}"]`);
      if (row) row.style.display = row.style.display==='none' ? 'flex' : 'none';
    });
  });
  root.querySelectorAll('.reply-input-row').forEach(row=>{
    row.querySelector('button').addEventListener('click', async ()=>{
      const input = row.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const post = state.posts.find(p=>p.id===row.dataset.postid);
      if (!post) return;
      post.replies = post.replies || [];
      post.replies.push({ from:'me', text, time:Date.now() });
      input.value='';
      await saveAll(); renderProfileTab();
      
      // 触发对方回复评论
      const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
      if(Math.random() * 100 < chance) {
        setTimeout(async () => {
          post.replies.push({ from:'partner', text:generateReplyText(), time:Date.now() });
          await saveAll();
          if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
        }, randInt(state.settings.minDelay, state.settings.maxDelay) * 1000);
      }
    });
  });
  // 点击某一条回复，可以针对这条回复再回复（楼中楼）
  root.querySelectorAll('.reply-block').forEach(block=>{
    const postEl = block.closest('.post');
    if (!postEl) return;
    const postId = postEl.dataset.id;
    const post = state.posts.find(p=>p.id===postId);
    if (!post) return;
    const ridx = +block.dataset.ridx;
    const r = (post.replies||[])[ridx];
    if (!r || r.pending || r.readOnly) return;
    block.addEventListener('click', ()=>{
      const replyToName = nameOf(r.from);
      promptModal(`回复 @${replyToName}`, '写下你的回复…', async val=>{
        const text = (val||'').trim();
        if (!text) return;
        post.replies = post.replies || [];
        post.replies.push({ from:'me', text, replyToName, time:Date.now() });
        await saveAll(); renderProfileTab();
        maybeReplyToPost(post.id);
      });
    });
  });
}
function openImgViewer(src){
  document.getElementById('ivImg').src = src;
  document.getElementById('imgViewer').classList.add('show');
}
document.getElementById('ivClose').addEventListener('click', ()=> document.getElementById('imgViewer').classList.remove('show'));

function maybeReplyToPost(postId){
  const chance = state.settings.readNoReply ? (100 - state.settings.noReplyChance) : 100;
  const willReply = Math.random()*100 < chance;
  const delayMs = randInt(state.settings.minDelay, state.settings.maxDelay) * 1000;
  const post = state.posts.find(p=>p.id===postId);
  if (!post) return;
  if (!willReply) return;
  const pendingReply = { from:'partner', pending:true, time:Date.now() };
  post.replies.push(pendingReply);
  if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
  setTimeout(async ()=>{
    const idx = post.replies.indexOf(pendingReply);
    const finalReply = { from:'partner', text:generateReplyText(), sticker:maybeSticker(), time:Date.now() };
    if (idx>-1) post.replies[idx] = finalReply; else post.replies.push(finalReply);
    await saveAll();
    if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
    notify(nameOf('partner')+'回复了你的动态');
  }, delayMs);
}
function schedulePartnerLike(postId){
  const s = state.settings;
  if (Math.random()*100 >= s.partnerLikeChance) return;
  const delayMs = randInt(s.partnerLikeDelayMin, s.partnerLikeDelayMax) * 60 * 1000;
  setTimeout(async ()=>{
    const post = state.posts.find(p=>p.id===postId);
    if (!post) return;
    post.likedBy = post.likedBy || [];
    if (!post.likedBy.includes('partner')) post.likedBy.push('partner');
    await saveAll();
    if (document.querySelector('.tab-btn.active')?.dataset.view==='profile') renderProfileTab();
    notify(nameOf('partner')+'赞了你的动态');
  }, delayMs);
}

async function switchCharacter(id){
  if (id===state.activeCharacterId) return;
  if (callState !== 'idle'){ endCall('通话已结束'); hideCallPill(); }
  showLoading('正在切换角色...');
  
  // 异步执行避免阻塞 UI 渲染 Loading
  setTimeout(async () => {
    const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
    if (idx>-1) state.characters[idx] = activeCharacterSnapshot();
    const target = state.characters.find(c=>c.id===id);
    if (!target) { hideLoading(); return; }
    
    loadCharacterInto(target);
    await saveAll();
    applyTheme(); renderAll(); setupStatusTimer();
    hideLoading();
    toast('已切换到 '+state.partner.name);
  }, 100);
}

  openSheet(`

      <label style="font-size:12px;color:var(--muted);">对方名称<input type="text" id="nc_partner" class="sheet-input" placeholder="对方的名字" style="margin-top:4px;"></label>
      <label style="font-size:12px;color:var(--muted);">我的名称（这个角色里）<input type="text" id="nc_me" class="sheet-input" placeholder="我的名字" style="margin-top:4px;"></label>
    </div>
    <div class="sheet-btn-row">
      <button onclick="closeSheet()">取消</button>
      <button class="primary" id="nc_save">创建并切换</button>
    </div>
  `, ()=>{
    document.getElementById('nc_save').addEventListener('click', async ()=>{
      const label = document.getElementById('nc_label').value.trim() || '新角色';
      const partnerName = document.getElementById('nc_partner').value.trim() || '对方';
      const meName = document.getElementById('nc_me').value.trim() || '我';
      const ch = freshCharacter(label);
      ch.partner.name = partnerName; ch.me.name = meName;
      const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
      if (idx>-1) state.characters[idx] = activeCharacterSnapshot();
      state.characters.push(ch);
      loadCharacterInto(ch);
      closeSheet();
      await saveAll();
      applyTheme(); renderAll(); setupStatusTimer(); renderSettings();
      toast('已创建并切换到 '+partnerName);
    });
  });

async function deleteCharacter(id){
  if (state.characters.length<=1){ toast('至少保留一个角色','fa-triangle-exclamation'); return; }
  state.characters = state.characters.filter(c=>c.id!==id);
  if (state.activeCharacterId===id){
    loadCharacterInto(state.characters[0]);
    applyTheme(); renderAll(); setupStatusTimer();
  }
  await saveAll(); renderSettings();
}

let cardSelections = new Set();
function renderCardList(){
  const box = document.getElementById('cardListBox');
  if (!box) return;
  box.innerHTML = state.cards.map((c,i)=>`<div class="ci"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" class="card-cb" data-i="${i}" ${cardSelections.has(i)?'checked':''}><span>${escapeHTML(c)}</span></label><button data-i="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('') || `<div class="ci" style="color:var(--muted)">暂无字卡</div>`;
  
  const updateBatchBtn = () => {
    const row = document.getElementById('batchDelCardsRow');
    const cnt = document.getElementById('cardSelCount');
    if(cardSelections.size > 0) { row.style.display = 'flex'; cnt.textContent = cardSelections.size; }
    else { row.style.display = 'none'; }
  };
  
  box.querySelectorAll('.card-cb').forEach(cb => {
    cb.addEventListener('change', e => {
      if(e.target.checked) cardSelections.add(+cb.dataset.i);
      else cardSelections.delete(+cb.dataset.i);
      updateBatchBtn();
    });
  });
  
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ 
      state.cards.splice(+btn.dataset.i,1); 
      cardSelections.clear();
      await saveAll(); renderSettings(); 
    });
  });
  updateBatchBtn();
}

function renderPokeList(){
  const box = document.getElementById('pokeListBox');
  if (!box) return;
  box.innerHTML = state.pokes.map((c,i)=>`<div class="ci"><span>${escapeHTML(c)}</span><button data-i="${i}"><i class="fa-solid fa-trash"></i></button></div>`).join('') || `<div class="ci" style="color:var(--muted)">暂无拍一拍</div>`;
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ state.pokes.splice(+btn.dataset.i,1); await saveAll(); renderSettings(); });
  });
}

let stickerSelections = new Set();

function renderLibraryGrid(){
  const box = document.getElementById('libraryGridBox');
  if (!box) return;
  box.innerHTML = state.imageLibrary.map((s,i)=>`<div class="si"><img src="${s}"><button data-i="${i}"><i class="fa-solid fa-xmark"></i></button></div>`).join('');
  box.querySelectorAll('button[data-i]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ state.imageLibrary.splice(+btn.dataset.i,1); await saveAll(); renderSettings(); });
  });

function renderCharList(){
  const box = document.getElementById('charListBox');
  if (!box) return;
  box.innerHTML = state.characters.map(c=>{
    const isActive = c.id===state.activeCharacterId;
    const p = isActive ? state.partner : c.partner;
    return `<div class="char-item ${isActive?'active':''}" data-id="${c.id}">
      <img src="${p.avatar||AVATAR_PLACEHOLDER}">
      <div class="ci-name">${escapeHTML(c.label)}<div style="font-weight:400;color:var(--muted);font-size:11px;">${escapeHTML(p.name)}</div></div>
      <div class="ci-actions">
        ${isActive ? `<span class="ci-current"><i class="fa-solid fa-circle-check"></i>当前</span>` : `<button class="ci-icon-btn" data-act="switch" title="切换到该角色"><i class="fa-solid fa-right-left"></i></button>`}
        <button class="ci-icon-btn" data-act="edit" title="编辑角色信息"><i class="fa-solid fa-pen"></i></button>
        ${state.characters.length>1 ? `<button class="ci-icon-btn danger" data-act="del" title="删除该角色"><i class="fa-solid fa-trash"></i></button>` : ''}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.char-item').forEach(el=>{
    const id = el.dataset.id;
    const switchBtn = el.querySelector('[data-act="switch"]');
    if (switchBtn) switchBtn.addEventListener('click', ()=> switchCharacter(id));
    const editBtn = el.querySelector('[data-act="edit"]');
    if (editBtn) editBtn.addEventListener('click', ()=> openEditCharacterSheet(id));
    const delBtn = el.querySelector('[data-act="del"]');
    if (delBtn) delBtn.addEventListener('click', ()=> confirmModal('删除该角色及其全部聊天记录？此操作不可撤销。', ()=> deleteCharacter(id)));
  });
}
function openEditCharacterSheet(id){
  const isActive = id===state.activeCharacterId;
  const c = state.characters.find(x=>x.id===id);
  if (!c) return;
  const p = isActive ? state.partner : c.partner;
  const m = isActive ? state.me : c.me;
  openSheet(`
    <h2>编辑角色信息</h2>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <label style="font-size:12px;color:var(--muted);">角色标签<input type="text" id="ec_label" value="${escapeHTML(c.label)}" class="sheet-input" style="margin-top:4px;"></label>
      <label style="font-size:12px;color:var(--muted);">对方名称<input type="text" id="ec_partner" value="${escapeHTML(p.name)}" class="sheet-input" style="margin-top:4px;"></label>
      <label style="font-size:12px;color:var(--muted);">我的名称（这个角色里）<input type="text" id="ec_me" value="${escapeHTML(m.name)}" class="sheet-input" style="margin-top:4px;"></label>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">只改名字，不会影响这个角色已有的聊天记录、动态和信件。</div>
    <div class="sheet-btn-row">
      <button onclick="closeSheet()">取消</button>
      <button class="primary" id="ec_save">保存</button>
    </div>
  `, ()=>{
    document.getElementById('ec_save').addEventListener('click', async ()=>{
      const newLabel = document.getElementById('ec_label').value.trim();
      const newPartnerName = document.getElementById('ec_partner').value.trim();
      const newMeName = document.getElementById('ec_me').value.trim();
      if (newLabel) c.label = newLabel;
      if (newPartnerName) p.name = newPartnerName;
      if (newMeName) m.name = newMeName;
      closeSheet();
      await saveAll(); renderSettings(); renderChat(); renderProfileTab();
      toast('已保存');
    });
  });
}

function bindSettingsEvents(){
  const s = state.settings;
  document.getElementById('settingsSaveBtn').addEventListener('click', async ()=>{
    await saveAll();
    applyTheme();
    toast('设置已保存', 'fa-check');
  });
  const bindNumber = (id,key,cb,onObj)=>{
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener('change', async ()=>{
      const v = parseFloat(el.value);
      const target = onObj || s;
      target[key] = isNaN(v) ? target[key] : v;
      el.value = target[key];
      applyTheme(); await saveAll(); if (cb) cb();
    });
  };
  bindNumber('setFontSize','fontSize', null); 
  document.getElementById('setFontSize').addEventListener('input', async e=>{
    s.fontSize = +e.target.value;
    document.getElementById('setFontSizeVal').textContent = e.target.value+'px';
    applyTheme(); await saveAll();
  });
  bindNumber('setMaxConcat','maxConcat');
  bindNumber('setMinDelay','minDelay');
  bindNumber('setMaxDelay','maxDelay');
  bindNumber('setNoReplyChance','noReplyChance');
  bindNumber('setStickerChance','stickerChance');
  bindNumber('setRedEnvelopeChance','redEnvelopeChance');
  bindNumber('setTransferChance','transferChance');
  bindNumber('setRedEnvelopeAcceptChance','redEnvelopeAcceptChance');
  bindNumber('setTransferAcceptChance','transferAcceptChance');
  bindNumber('setPartnerLikeChance','partnerLikeChance');
  bindNumber('setPartnerLikeDelayMin','partnerLikeDelayMin');
  bindNumber('setPartnerLikeDelayMax','partnerLikeDelayMax');
  bindNumber('setAutoPostInterval','autoPostInterval', setupAutoPost);
  bindNumber('setAutoPostChance','autoPostChance');
  bindNumber('setCallInChance','callInChance');
  bindNumber('setCallAcceptChance','callAcceptChance');
  bindNumber('setProactiveInterval','proactiveInterval', setupProactive);
  bindNumber('setLetterCardCount','letterCardCount');
  bindNumber('setLetterReplyMin','letterReplyMinMinutes');
  bindNumber('setLetterReplyMax','letterReplyMaxMinutes');
  bindNumber('setLetterProactiveInterval','letterProactiveInterval', setupLetterProactive);
  bindNumber('setAvatarSwapChance','avatarSwapChance');
  bindNumber('setAvatarSwapInterval','avatarSwapInterval', setupAvatarSwap);
  bindNumber('setStatusChangeInterval','statusChangeInterval', setupStatusTimer);
  bindNumber('setMyBalance','balance', null, state.me);
  bindNumber('setPartnerBalance','balance', null, state.partner);

  document.getElementById('setMyName').addEventListener('change', async e=>{ state.me.name=e.target.value; await saveAll(); renderProfileTab(); renderChat(); });
  document.getElementById('setPartnerName').addEventListener('change', async e=>{ state.partner.name=e.target.value; await saveAll(); renderProfileTab(); renderChat(); });
  document.getElementById('setMyAvatar').addEventListener('click', ()=> pickImage(async url=>{ state.me.avatar=url; await saveAll(); renderSettings(); renderChat(); }));
  document.getElementById('setPartnerAvatar').addEventListener('click', ()=> pickImage(async url=>{ state.partner.avatar=url; await saveAll(); renderSettings(); renderChat(); }));
  document.getElementById('setChatBg').addEventListener('click', ()=> pickImage(async url=>{ s.chatBg=url; await saveAll(); applyTheme(); toast('背景已更新'); }));
  document.getElementById('clearChatBg').addEventListener('click', async ()=>{ s.chatBg=''; await saveAll(); applyTheme(); toast('已恢复默认背景'); });

  // 气泡样式管理
  document.getElementById('btnBubblePreset').addEventListener('click', async ()=>{
    s.bubbleStyleType = 'preset';
    await saveAll(); renderSettings(); applyTheme();
  });
  document.getElementById('btnBubbleCustom').addEventListener('click', async ()=>{
    s.bubbleStyleType = 'custom';
    await saveAll(); renderSettings(); applyTheme();
  });
  document.querySelectorAll('[data-preset-idx]').forEach(btn => {
    btn.addEventListener('click', async ()=>{
      s.bubblePresetIndex = +btn.dataset.presetIdx;
      await saveAll(); renderSettings(); applyTheme();
    });
  });
  document.getElementById('saveBubbleCustomCSS').addEventListener('click', async ()=>{
    s.bubbleCustomCSS = document.getElementById('bubbleCustomCSS').value;
    await saveAll(); applyTheme(); toast('自定义 CSS 已保存并应用');
  });
  document.getElementById('savePresetBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newPresetName').value.trim();
    if (!name){ toast('请先给预设起个名字','fa-triangle-exclamation'); return; }
    const preset = { id:'preset'+Date.now(), name, css: document.getElementById('bubbleCustomCSS').value, fontName: state.fontName, fontDataUrl: state.fontDataUrl };
    state.userPresets.push(preset);
    await saveAll(); renderSettings();
    toast('预设已保存');
  });
  document.querySelectorAll('[data-applypreset]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const preset = state.userPresets.find(p=>p.id===btn.dataset.applypreset);
      if (!preset) return;
      s.bubbleStyleType = 'custom';
      s.bubbleCustomCSS = preset.css;
      if (preset.fontName && preset.fontDataUrl){
        state.fontName = preset.fontName; state.fontDataUrl = preset.fontDataUrl;
        await applyCustomFont(preset.fontName, preset.fontDataUrl);
      }
      await saveAll(); applyTheme(); renderSettings();
      toast('已应用预设：'+preset.name);
    });
  });
  document.querySelectorAll('[data-delpreset]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.userPresets = state.userPresets.filter(p=>p.id!==btn.dataset.delpreset);
      await saveAll(); renderSettings();
    });
  });

  document.getElementById('importFontLbl').addEventListener('click', ()=> document.getElementById('fontImportFile').click());
  document.getElementById('fontImportFile').onchange = async e=>{
    const f = e.target.files[0]; if (!f) return;
    const dataUrl = await fileToDataURL(f);
    const name = 'userfont_'+Date.now();
    await applyCustomFont(name, dataUrl);
    state.fontName = f.name.replace(/\.[^.]+$/,''); state.fontDataUrl = dataUrl;
    await applyCustomFont(state.fontName, dataUrl);
    await saveAll(); renderSettings();
    toast('字体已应用');
    e.target.value='';
  };
  document.getElementById('setFontUrlBtn').addEventListener('click', ()=>{
    promptModal('字体文件链接', 'https://.../font.ttf', async url=>{
      if (!url) return;
      const name = 'urlfont_'+Date.now();
      await applyCustomFont(name, url);
      state.fontName = name; state.fontDataUrl = url;
      await saveAll(); renderSettings();
      toast('字体已应用');
    });
  });
  document.getElementById('clearFontBtn').addEventListener('click', async ()=>{
    removeCustomFont();
    await saveAll(); renderSettings(); toast('已恢复默认字体');
  });

  document.getElementById('setDynamicIsland').addEventListener('change', async e=>{ s.dynamicIsland=e.target.checked; applyTheme(); await saveAll(); });
  document.getElementById('setConcatEnabled').addEventListener('change', async e=>{ s.concatEnabled=e.target.checked; await saveAll(); });
  document.getElementById('setReadNoReply').addEventListener('change', async e=>{ s.readNoReply=e.target.checked; await saveAll(); });
  document.getElementById('setProactive').addEventListener('change', async e=>{ s.proactiveEnabled=e.target.checked; await saveAll(); setupProactive(); });
  document.getElementById('setLetterProactive').addEventListener('change', async e=>{ s.letterProactiveEnabled=e.target.checked; await saveAll(); setupLetterProactive(); });
  document.getElementById('setAvatarSwapEnabled').addEventListener('change', async e=>{ s.avatarSwapEnabled=e.target.checked; await saveAll(); setupAvatarSwap(); });
  document.getElementById('setAutoPostEnabled').addEventListener('change', async e=>{ s.autoPostEnabled=e.target.checked; await saveAll(); setupAutoPost(); });
  document.getElementById('setMultiMsgEnabled').addEventListener('change', async e=>{ s.multiMsgEnabled=e.target.checked; await saveAll(); });
  document.getElementById('setMultiMsgMin').addEventListener('change', async e=>{ s.multiMsgMin=parseInt(e.target.value)||1; await saveAll(); });
  document.getElementById('setMultiMsgMax').addEventListener('change', async e=>{ s.multiMsgMax=parseInt(e.target.value)||1; await saveAll(); });
  document.getElementById('testAvatarSwapBtn').addEventListener('click', async ()=>{
    if (state.imageLibrary.length===0){ toast('图片库是空的，先去上传几张图片吧','fa-triangle-exclamation'); return; }
    const pick = ()=> state.imageLibrary[randInt(0,state.imageLibrary.length-1)];
    const roll = Math.random();
    let msg;
    if (roll < 0.34){ state.partner.avatar = pick(); msg = '对方悄悄换了新头像'; }
    else if (roll < 0.6){ state.me.avatar = pick(); msg = '对方把你的头像换了'; }
    else if (roll < 0.8){ state.partner.banner = pick(); msg = '对方换了主页背景图'; }
    else { state.me.avatar = pick(); state.partner.avatar = pick(); msg = '对方把你们俩的头像都换了'; }
    await saveAll(); renderSettings(); renderChat();
    showPopup('头像更新啦', msg, 'fa-camera');
  });
  document.getElementById('testAutoPostBtn').addEventListener('click', async ()=>{
    const post = { id:'p'+Date.now(), author:'partner', pinned:false, time:Date.now(), text:generateReplyText(), image:'', replies:[], baseLikes: 0, likedBy:[] };
    state.posts.push(post);
    await saveAll();
    toast('已生成一条测试动态');
  });
  document.getElementById('dedupPokesBtn').addEventListener('click', async ()=>{
    const before = state.pokes.length;
    state.pokes = [...new Set(state.pokes)];
    const after = state.pokes.length;
    await saveAll(); renderSettings();
    toast(`去重完成，移除了 ${before - after} 条重复内容`);
  });
  document.getElementById('dedupLibraryBtn').addEventListener('click', async ()=>{
    const before = state.imageLibrary.length;
    state.imageLibrary = [...new Set(state.imageLibrary)];
    const after = state.imageLibrary.length;
    await saveAll(); renderSettings();
    toast(`去重完成，移除了 ${before - after} 张重复图片`);
  });
  document.getElementById('dedupStatusBtn').addEventListener('click', async ()=>{
    const before = state.partnerStatusList.length;
    const seen = new Set(); const deduped = [];
    state.partnerStatusList.forEach(s2=>{ const key = s2.emoji+s2.text; if (!seen.has(key)){ seen.add(key); deduped.push(s2); } });
    state.partnerStatusList = deduped;
    const after = state.partnerStatusList.length;
    await saveAll(); renderSettings();
    toast(`去重完成，移除了 ${before - after} 条重复状态`);
  });
  document.getElementById('setKeepAlive').addEventListener('change', async e=>{ s.keepAlive=e.target.checked; await saveAll(); setupKeepAlive(); });
  document.getElementById('setDesktopNotify').addEventListener('change', async e=>{
    if (e.target.checked && 'Notification' in window){
      const perm = await Notification.requestPermission();
      s.desktopNotify = perm==='granted'; e.target.checked = s.desktopNotify;
      if (!s.desktopNotify) toast('未获得通知权限', 'fa-triangle-exclamation');
    } else { s.desktopNotify=false; }
    await saveAll();
  });

  document.getElementById('editPartnerStatusBtn').addEventListener('click', ()=> openStatusPicker('partner'));
  document.getElementById('editMyStatusBtn').addEventListener('click', ()=> openStatusPicker('me'));

  // 字卡管理
  document.getElementById('bulkAddBtn').addEventListener('click', async ()=>{
    const ta = document.getElementById('bulkCards');
    const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
    if (lines.length===0) return;
    state.cards.push(...lines); ta.value='';
    await saveAll(); renderSettings();
    toast(`已添加 ${lines.length} 条字卡`);
  });
  document.getElementById('dedupCardsBtn').addEventListener('click', async ()=>{
    const before = state.cards.length;
    state.cards = [...new Set(state.cards)];
    const after = state.cards.length;
    cardSelections.clear();
    await saveAll(); renderSettings();
    toast(`去重完成，移除了 ${before - after} 条重复字卡`);
  });
  document.getElementById('batchDelCardsBtn').addEventListener('click', async ()=>{
    if(cardSelections.size === 0) return;
    const toDelete = Array.from(cardSelections).sort((a,b)=>b-a);
    toDelete.forEach(idx => state.cards.splice(idx, 1));
    cardSelections.clear();
    await saveAll(); renderSettings();
    toast('已删除选中字卡');
  });
  document.getElementById('importCardsLbl').addEventListener('click', ()=> document.getElementById('cardImportFile').click());
  document.getElementById('cardImportFile').onchange = async e=>{
    const f = e.target.files[0]; if (!f) return;
    try{
      const text = await f.text();
      const parsed = JSON.parse(text);
      let arr = [];
      if (Array.isArray(parsed)) arr = parsed.filter(x=>typeof x==='string');
      else if (parsed && Array.isArray(parsed.customReplies)) arr = parsed.customReplies.filter(x=>typeof x==='string');
      const existingCards = new Set(state.cards);
      const newCards = arr.filter(x=>!existingCards.has(x));
      if (parsed && Array.isArray(parsed.customPokes)){
        const existingPokes = new Set(state.pokes);
        state.pokes.push(...parsed.customPokes.filter(x=>!existingPokes.has(x)));
      }
      if (parsed && Array.isArray(parsed.customStatuses)){
        const existingStatusText = new Set(state.partnerStatusList.map(s=>s.text));
        parsed.customStatuses.forEach((t,i)=>{ if (!existingStatusText.has(t)){ state.partnerStatusList.push({emoji:DEFAULT_STATUS_EMOJIS[i%DEFAULT_STATUS_EMOJIS.length],text:t}); existingStatusText.add(t); } });
      }
      if (parsed && Array.isArray(parsed.customEmojis)){
        const existingKaomoji = new Set(state.kaomoji);
        state.kaomoji.push(...parsed.customEmojis.filter(x=>!existingKaomoji.has(x)));
      }
      if (newCards.length || arr.length){
        state.cards.push(...newCards);
        await saveAll(); renderSettings();
        const skipped = arr.length - newCards.length;
        toast(`导入成功，新增 ${newCards.length} 条${skipped?`（跳过 ${skipped} 条重复）`:''}`);
      }
      else toast('未在文件中找到字卡数组','fa-triangle-exclamation');
    }catch(err){ toast('导入失败：'+err.message,'fa-triangle-exclamation'); }
    e.target.value='';
  };
  document.getElementById('exportCardsBtn').addEventListener('click', ()=> downloadJSON(state.cards,'cards.json'));
  document.getElementById('clearCardsBtn').addEventListener('click', ()=> confirmModal('清空全部字卡？此操作不可撤销。', async ()=>{ state.cards=[]; await saveAll(); renderSettings(); }));
  
  // 拍一拍管理
  document.getElementById('addPokeBtn').addEventListener('click', async ()=>{
    const val = document.getElementById('newPokeInput').value.trim();
    if(!val) return;
    state.pokes.push(val);
    await saveAll(); renderSettings();
    toast('添加成功');
  });

  document.getElementById('clearKaomojiBtn').addEventListener('click', ()=> confirmModal('重置颜文字为默认列表？', async ()=>{ state.kaomoji=[...UPLOADED_KAOMOJI]; await saveAll(); renderSettings(); }));

  // 表情包管理
  document.getElementById('dedupStickersBtn').addEventListener('click', async ()=>{
    const before = state.stickers.length;
    state.stickers = [...new Set(state.stickers)];
    const after = state.stickers.length;
    stickerSelections.clear();
    await saveAll(); renderSettings();
    toast(`去重完成，移除了 ${before - after} 张重复贴纸`);
  });
  document.getElementById('batchDelStickersBtn').addEventListener('click', async ()=>{
    if(stickerSelections.size === 0) return;
    const toDelete = Array.from(stickerSelections).sort((a,b)=>b-a);
    toDelete.forEach(idx => state.stickers.splice(idx, 1));
    stickerSelections.clear();
    await saveAll(); renderSettings();
    toast('已删除选中贴纸');
  });
  document.getElementById('importStickersAlbumBtn').addEventListener('click', ()=> document.getElementById('stickerImportFile').click());
  document.getElementById('stickerImportFile').onchange = async e=>{
    const files = [...e.target.files];
    let added = 0;
    showLoading('处理中...');
    for (const f of files) {
      const dataUrl = await compressImage(f);
      if(!state.stickers.includes(dataUrl)) {
        state.stickers.push(dataUrl);
        added++;
      }
    }
    hideLoading();
    await saveAll(); renderSettings(); e.target.value='';
    toast(`成功导入 ${added} 张贴纸`);
  };
  document.getElementById('importStickersUrlBtn').addEventListener('click', ()=>{
    promptMultilineModal('贴纸图片链接','一行一个链接，可以一次粘贴多个', async val=>{
      const urls = (val||'').split('\n').map(u=>u.trim()).filter(Boolean);
      if (!urls.length) return;
      const existing = new Set(state.stickers);
      let added = 0, skipped = 0;
      urls.forEach(u=>{ if (!existing.has(u)){ state.stickers.push(u); existing.add(u); added++; } else skipped++; });
      await saveAll(); renderSettings();
      toast(`导入 ${added} 张${skipped?`，跳过 ${skipped} 张重复`:''}`);
    });
  });

  document.getElementById('importLibraryAlbumBtn').addEventListener('click', ()=> document.getElementById('libraryImportFile').click());
  document.getElementById('libraryImportFile').onchange = async e=>{
    const files = [...e.target.files];
    showLoading('处理中...');
    let added = 0;
    for (const f of files) {
      const dataUrl = await compressImage(f);
      if (!state.imageLibrary.includes(dataUrl)) { state.imageLibrary.push(dataUrl); added++; }
    }
    hideLoading();
    await saveAll(); renderSettings(); e.target.value='';
    toast(`成功导入 ${added} 张图片`);
  };
  document.getElementById('importLibraryUrlBtn').addEventListener('click', ()=>{
    promptMultilineModal('图片链接','一行一个链接，可以一次粘贴多个', async val=>{
      const urls = (val||'').split('\n').map(u=>u.trim()).filter(Boolean);
      if (!urls.length) return;
      const existing = new Set(state.imageLibrary);
      let added = 0, skipped = 0;
      urls.forEach(u=>{ if (!existing.has(u)){ state.imageLibrary.push(u); existing.add(u); added++; } else skipped++; });
      await saveAll(); renderSettings();
      toast(`导入 ${added} 张${skipped?`，跳过 ${skipped} 张重复`:''}`);
    });
  });

  document.getElementById('addCharBtn').addEventListener('click', openAddCharacterSheet);

  document.getElementById('exportAllBtn').addEventListener('click', ()=>{
    const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
    if (idx>-1) state.characters[idx] = activeCharacterSnapshot();
    downloadJSON({cards:state.cards, stickers:state.stickers, kaomoji:state.kaomoji, pokes:state.pokes, imageLibrary:state.imageLibrary, characters:state.characters, activeCharacterId:state.activeCharacterId, settings:state.settings}, 'chuanxun-backup.json');
  });
  document.getElementById('importAllBtn').addEventListener('click', ()=> document.getElementById('dataImportFile').click());
  document.getElementById('dataImportFile').onchange = async e=>{
    const f = e.target.files[0]; if (!f) return;
    try{
      const data = JSON.parse(await f.text());
      state.cards = data.cards ?? state.cards;
      state.stickers = data.stickers ?? state.stickers;
      state.kaomoji = data.kaomoji ?? state.kaomoji;
      state.pokes = data.pokes ?? state.pokes;
      state.imageLibrary = data.imageLibrary ?? state.imageLibrary;
      state.settings = {...DEFAULT_SETTINGS, ...(data.settings||{})};
      if (Array.isArray(data.characters) && data.characters.length){
        state.characters = data.characters;
        loadCharacterInto(state.characters.find(c=>c.id===data.activeCharacterId) || state.characters[0]);
      }
      await saveAll(); applyTheme(); renderAll(); setupProactive(); setupLetterProactive(); setupAvatarSwap(); setupAutoPost(); setupStatusTimer();
      toast('数据已导入');
    }catch(err){ toast('导入失败：'+err.message,'fa-triangle-exclamation'); }
    e.target.value='';
  };
  document.getElementById('clearMsgsBtn').addEventListener('click', ()=> confirmModal('清空所有聊天消息？此操作不可撤销。', async ()=>{ state.messages=[]; await saveAll(); renderAll(); }));
  document.getElementById('clearPostsBtn').addEventListener('click', ()=> confirmModal('清空所有动态记录？此操作不可撤销。', async ()=>{ state.posts=[]; await saveAll(); renderAll(); }));
  document.getElementById('clearLettersBtn').addEventListener('click', ()=> confirmModal('清空所有信件记录？此操作不可撤销。', async ()=>{ state.letters=[]; await saveAll(); renderAll(); }));
  document.getElementById('resetAllBtn').addEventListener('click', ()=> confirmModal('重置当前角色的全部数据？此操作不可撤销。', async ()=>{
    const label = state.characters.find(c=>c.id===state.activeCharacterId)?.label || '默认角色';
    const fresh = freshCharacter(label);
    fresh.id = state.activeCharacterId;
    const idx = state.characters.findIndex(c=>c.id===state.activeCharacterId);
    if (idx>-1) state.characters[idx] = fresh;
    loadCharacterInto(fresh);
    await saveAll(); applyTheme(); renderAll(); setupStatusTimer();
    toast('已重置');
  }));
  document.getElementById('replayOnboardBtn').addEventListener('click', ()=> startOnboarding());
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================================
   导航切换
   ============================================================================ */
const viewTitles = { chat:'聊天', letters:'信件', profile:'动态', settings:'设置' };
function switchView(name){
  document.querySelectorAll('.view').forEach(v=> v.classList.add('hidden'));
  document.getElementById('view-'+name).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  const showChatHeader = name==='chat';
  document.getElementById('topbarAvatar').style.display = showChatHeader ? 'block' : 'none';
  if (!showChatHeader) document.getElementById('topbarTitle').textContent = viewTitles[name];
  document.getElementById('topbarStatusTag').style.display = showChatHeader ? 'inline' : 'none';
  document.getElementById('topbarSub').style.display = showChatHeader ? 'block' : 'none';
  document.getElementById('topbarCallBtn').style.display = name==='chat' ? 'flex' : 'none';
  if (name==='chat') {
    renderChat();
    requestAnimationFrame(()=>{
      scrollChatToBottom();
      setTimeout(scrollChatToBottom, 80);
    });
  }
  if (name==='letters') renderLetters();
  if (name==='profile') renderProfileTab();
  if (name==='settings') renderSettings();
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});

  { icon:'fa-comment-dots', title:'聊天输入区', text:'左起第一个「+」：展开更多功能\n中间输入框右侧的对话气泡图标：让对方主动说一句话\n笑脸图标：表情 / 颜文字 / 贴纸\n最右侧圆钮：没有输入内容时是「批量发送」——可以一次性发送多条消息；有内容时会变成发送箭头。' },

  { icon:'fa-phone', title:'通话', text:'接听是绿色按钮，拒接是红色按钮。通话中点左上角箭头可以最小化成悬浮条，悬浮条可以拖动到任意位置，不耽误你继续打字；点悬浮条能重新展开通话界面。视频通话时右上角相机图标可以更换背景。' },
  { icon:'fa-sliders', title:'状态与头像', text:'对方名字右侧会显示一个小状态（比如「😮‍💨疲惫」），会按设置里的间隔自动切换，你也可以点开自定义，自己的状态在「动态」我的主页也能点开设置。\n上传图片到「设置→图片库」后，对方还有概率随机换头像、换你的头像、换主页背景。' },
  { icon:'fa-compass', title:'动态就是主页', text:'点顶部「我的主页/对方主页」切换查看。仿推特的四个分区：帖子、回复、媒体、喜欢。右下角圆形「+」按钮发布新动态。对方也会按设置的概率自动发动态、点赞或评论你的内容。' },
  { icon:'fa-envelope', title:'信件', text:'比聊天更慢更正式的功能。写一封长信发出后会有暖心的等待提示，对方会在设定时间内回信，也可能主动写信给你，都会有弹窗提醒。' },
  { icon:'fa-user', title:'角色切换', text:'在「设置→角色管理」里可以新增角色。每个角色的聊天、动态、信件都是独立保存的，切换角色会自动保存当前进度并加载新角色，互不干扰。' }
];
let onboardIdx = 0;
function startOnboarding(){
  onboardIdx = 0;
  renderOnboardStep();
  document.getElementById('onboardMask').style.display='flex';
}
function renderOnboardStep(){
  const step = ONBOARD_STEPS[onboardIdx];
  const isLast = onboardIdx === ONBOARD_STEPS.length-1;
  document.getElementById('onboardMask').innerHTML = `
    <div class="ob-icon"><i class="fa-solid ${step.icon}"></i></div>
    <h2>${step.title}</h2>
    <p>${step.text}</p>
    <div class="ob-nav">
      <div class="dots">${ONBOARD_STEPS.map((_,i)=>`<span class="${i===onboardIdx?'on':''}"></span>`).join('')}</div>
      <div class="ob-btns">
        <button class="skip" id="obSkip">跳过</button>
        <button class="next" id="obNext">${isLast?'开始体验':'下一步'}</button>
      </div>
    </div>
  `;
  document.getElementById('obSkip').addEventListener('click', finishOnboarding);
  document.getElementById('obNext').addEventListener('click', ()=>{
    if (isLast) finishOnboarding(); else { onboardIdx++; renderOnboardStep(); }
  });
}
async function finishOnboarding(){
  document.getElementById('onboardMask').style.display='none';
  state.settings.onboarded = true;
  await saveAll();
}

/* ============================================================================
   初始化
   ============================================================================ */
function renderAll(){
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.view || 'chat';
  if (activeTab==='chat') renderChat();
  if (activeTab==='letters') renderLetters();
  if (activeTab==='profile') renderProfileTab();
  if (activeTab==='settings') renderSettings();
}
async function init(){
  await loadAll();
  applyTheme();
  switchView('chat');
  setupProactive();
  setupLetterProactive();
  setupKeepAlive();
  setupAvatarSwap();
  setupStatusTimer();
  setupAutoPost();
  if (!state.settings.onboarded) startOnboarding();
}
init();
</script>
